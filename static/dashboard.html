<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
</head>

<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">📊 Smart City Dashboard</h2>

    <!-- Stats -->
    <div class="row text-center mb-4">
        <div class="col-md-3">
            <div class="card p-3 bg-primary text-white">Total: <span id="total">0</span></div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 bg-warning">Pending: <span id="pending">0</span></div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 bg-info text-white">In Progress: <span id="in_progress">0</span></div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 bg-success text-white">Resolved: <span id="resolved">0</span></div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-header">Complaints</div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
async function loadDashboard() {
    const res = await fetch("/api/dashboard");
    const data = await res.json();

    console.log(data); // DEBUG

    document.getElementById("total").innerText = data.total || 0;
    document.getElementById("pending").innerText = data.pending || 0;
    document.getElementById("in_progress").innerText = data.in_progress || 0;
    document.getElementById("resolved").innerText = data.resolved || 0;

    const table = document.getElementById("tableBody");
    table.innerHTML = "";

    if (data.complaints && data.complaints.length > 0) {
        if (data.complaints && data.complaints.length > 0) {
    data.complaints.forEach(c => {
        table.innerHTML += `
            <tr>
                <td>${c.id}</td>
                <td>${c.description}</td>
                <td>${c.category}</td>
                <td>${c.priority}</td>
                <td>${c.status}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteComplaint(${c.id})">
                        Delete
                    </button>
                </td>
            </tr>
        `;
    });}
    } else {
        table.innerHTML = `<tr><td colspan="5" class="text-center">No complaints yet</td></tr>`;
    }
}

loadDashboard();
async function deleteComplaint(id) {
    const confirmDelete = confirm("Are you sure you want to delete this complaint?");
    if (!confirmDelete) return;

    const res = await fetch(`/api/complaint/${id}`, {
        method: "DELETE"
    });

    if (res.ok) {
        alert("Deleted successfully");
        loadDashboard(); // refresh table
    } else {
        alert("Delete failed");
    }
}
</script>

</body>
</html>
